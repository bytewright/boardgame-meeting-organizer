databaseChangeLog:
  - changeSet:
      id: 20260725-1
      author: bytewright
      changes:
        - createTable:
            tableName: adapter_datas
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_adapter_datas
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: adapter_name
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: data_identifier
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: data
                  type: jsonb
        - addUniqueConstraint:
            columnNames: adapter_name, data_identifier
            constraintName: UC_ADAPTER_DATA_IDENTIFIER
            tableName: adapter_datas